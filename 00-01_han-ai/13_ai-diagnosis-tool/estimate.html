  /* ─── ざつね屋 グローバルヘッダー・ナビ・フッター ─── */
  :root{--gz-tt:#31747C;--gz-tt-d:#267882;--gz-ts:#EAF6F8;--gz-cl:#E1EEF0;--gz-tx:#575757;--gz-hd:#3C3C3C}
  .site-header{position:sticky;top:0;z-index:500;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--gz-cl)}
  .site-header__inner{display:flex;align-items:center;max-width:1200px;margin:0 auto;padding:0 24px;height:64px}
  .site-logo{font-weight:700;font-size:1.1rem;color:var(--gz-tt);text-decoration:none;letter-spacing:.02em;white-space:nowrap}
  .site-logo__prefix{font-size:.73em;font-weight:400;color:var(--gz-tx)}
  .site-header .site-nav{position:static;top:auto;z-index:auto;background:transparent;backdrop-filter:none;border-bottom:none;padding:0;height:auto;display:flex;align-items:center;gap:8px;margin-left:auto;justify-content:flex-end}
  .site-nav__list{display:flex;list-style:none;margin:0;padding:0;gap:4px;align-items:center}
  .site-nav__link{font-size:.9375rem;padding:8px 12px;color:var(--gz-tx);text-decoration:none;letter-spacing:.02em;display:inline-block;transition:color .2s}
  .site-nav__link:hover,.site-nav__link.is-active{color:var(--gz-tt)}
  .site-nav__item--dropdown{position:relative}
  .site-nav__dropdown-trigger{background:none;border:none;cursor:pointer;font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;font-size:.9375rem;padding:8px 12px;color:var(--gz-tx);letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px;transition:color .2s}
  .site-nav__dropdown-trigger:hover{color:var(--gz-tt)}
  .site-nav__caret{font-size:.75rem;pointer-events:none}
  .site-nav__dropdown{position:absolute;top:100%;left:0;min-width:200px;background:#fff;box-shadow:0 8px 24px rgba(40,60,70,.12);border-radius:4px;list-style:none;padding:8px 0;margin:0;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .2s,transform .2s}
  .site-nav__item--dropdown.is-open .site-nav__dropdown{opacity:1;pointer-events:auto;transform:translateY(0)}
  .site-nav__dropdown-link{display:block;padding:8px 16px;color:var(--gz-hd);text-decoration:none;font-size:.875rem;letter-spacing:.02em;transition:background .15s,color .15s}
  .site-nav__dropdown-link:hover{background:var(--gz-ts);color:var(--gz-tt)}
  .site-nav__cta{background:#5BBDC8;color:#fff;padding:8px 20px;border-radius:4px;font-weight:600;text-decoration:none;font-size:.875rem;letter-spacing:.02em;transition:background .2s;white-space:nowrap;margin-left:8px}
  .site-nav__cta:hover{background:var(--gz-tt-d);color:#fff}
  .site-nav__hamburger{display:none;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:8px;width:40px;height:40px;margin-left:8px}
  .site-nav__hamburger-line{display:block;width:24px;height:2px;background:var(--gz-hd);margin:3px 0;transition:transform .3s,opacity .3s}
  .site-nav__hamburger[aria-expanded="true"] .site-nav__hamburger-line:nth-child(1){transform:translateY(8px) rotate(45deg)}
  .site-nav__hamburger[aria-expanded="true"] .site-nav__hamburger-line:nth-child(2){opacity:0}
  .site-nav__hamburger[aria-expanded="true"] .site-nav__hamburger-line:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
  @media(max-width:768px){
    .site-nav__hamburger{display:flex}
    .site-header .site-nav{display:none;position:absolute;top:64px;left:0;right:0;background:rgba(255,255,255,.98);border-bottom:1px solid var(--gz-cl);padding:16px 24px;flex-direction:column;align-items:flex-start;gap:0;margin-left:0;box-shadow:0 8px 24px rgba(40,60,70,.12)}
    .site-header .site-nav.is-open{display:flex}
    .site-nav__list{flex-direction:column;width:100%;gap:0}
    .site-nav__item{width:100%}
    .site-nav__link{display:block;width:100%;padding:12px 16px}
    .site-nav__dropdown-trigger{width:100%;padding:12px 16px}
    .site-nav__item--dropdown{position:static}
    .site-nav__dropdown{position:static;box-shadow:none;border-radius:0;opacity:1;pointer-events:none;transform:none;display:none;padding:0 0 0 16px}
    .site-nav__item--dropdown.is-open .site-nav__dropdown{display:block;pointer-events:auto}
    .site-nav__cta{margin-top:12px;margin-left:0;display:block;text-align:center}
  }
  .site-footer{background:#334A52;padding:48px 24px 32px}
  .site-footer__inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;flex-wrap:wrap;gap:16px}
  .site-footer__logo{font-weight:700;color:#fff;text-decoration:none;font-size:1rem;letter-spacing:.02em}

  .site-footer__nav a:hover{color:#fff}
  .site-footer__copy{font-size:.75rem;color:#A6B7BC;margin:0;letter-spacing:.02em}
  @media(max-width:480px){

  <script>
/* ざつね屋 グローバルナビ制御 */
(function(){
  'use strict';
  var hamburger=document.getElementById('nav-hamburger');
  var siteNav=document.getElementById('site-nav');
  if(hamburger&&siteNav){
    hamburger.addEventListener('click',function(){
      var isOpen=hamburger.getAttribute('aria-expanded')==='true';
      hamburger.setAttribute('aria-expanded',String(!isOpen));
      siteNav.classList.toggle('is-open',!isOpen);
    });
  }
  document.querySelectorAll('.site-nav__dropdown-trigger').forEach(function(trigger){
    trigger.addEventListener('click',function(e){
      e.stopPropagation();
      var isOpen=trigger.getAttribute('aria-expanded')==='true';
      document.querySelectorAll('.site-nav__item--dropdown.is-open').forEach(function(el){
        el.classList.remove('is-open');
        el.querySelector('.site-nav__dropdown-trigger').setAttribute('aria-expanded','false');
      });
      if(!isOpen){
        trigger.setAttribute('aria-expanded','true');
        var parent=trigger.closest('.site-nav__item--dropdown');
        if(parent)parent.classList.add('is-open');
      }
    });
  });
  document.addEventListener('click',function(e){
    if(hamburger&&siteNav&&siteNav.classList.contains('is-open')&&!siteNav.contains(e.target)&&!hamburger.contains(e.target)){
      siteNav.classList.remove('is-open');
      hamburger.setAttribute('aria-expanded','false');
    }
    if(!e.target.closest('.site-nav__item--dropdown')){
      document.querySelectorAll('.site-nav__item--dropdown.is-open').forEach(function(el){
        el.classList.remove('is-open');
        el.querySelector('.site-nav__dropdown-trigger').setAttribute('aria-expanded','false');
      });
    }
  });
  var here=location.pathname.split('/').pop()||'index.html';
  document.querySelectorAll('.site-nav__link[href]').forEach(function(a){
    var href=a.getAttribute('href')||'';
    if(href.startsWith('http'))return;
    var file=href.split('#')[0].split('/').pop();
    if(file&&file===here)a.classList.add('is-active');
  });
})();
</script>
