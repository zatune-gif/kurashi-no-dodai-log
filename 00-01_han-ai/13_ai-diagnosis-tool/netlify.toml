[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# publish = "." のため、公開フォルダに入ってしまう開発用ファイル（README・依存定義・関数のソース・テスト）を
# 外から見えないようにする。公開ページのURLは一切変えない（force = true で 404 を返す）。
# 画面から使う関数は /api/... で動くため影響しない。
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
